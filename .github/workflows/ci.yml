name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify version and release tooling
        run: |
          python3 Scripts/release.py check
          python3 -m unittest discover -s Tests/ReleaseTests -v
          zsh -n Scripts/build-app.sh Scripts/build-sqlcipher.sh Scripts/package-release.sh
      - name: Install build-only pkg-config
        run: command -v pkg-config || brew install pkg-config
      - name: Build pinned database and run Swift tests
        run: |
          Scripts/build-sqlcipher.sh
          export PKG_CONFIG_PATH="$PWD/.build-release-deps/prefix/lib/pkgconfig"
          swift test --scratch-path .build-standalone
      - name: Build and verify standalone preview installer
        run: Scripts/package-release.sh
      - name: Preserve preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Deckhand-preview-${{ github.run_id }}
          path: |
            build/release/Deckhand-arm64.dmg
            build/release/Deckhand-*-source.tar.gz
            build/release/release-notes.md
            build/release/release-manifest.json
            build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
